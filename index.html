<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cookie Clicker</title>
  <meta name="description" content="A pixel-perfect, feature-rich web recreation of the legendary Cookie Clicker game. Bake infinite cookies, buy buildings, unlock authentic upgrades and achievements!">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍪</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kavoon&family=Outfit:wght@400;600;700;800&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-app">
    <!-- LEFT COLUMN: Big Cookie, Milk & Orbit Cursors -->
    <aside id="section-left" class="game-column" aria-label="Bakery & Big Cookie">
      <header class="bakery-header">
        <h1 id="bakery-name" class="bakery-title" title="Click to rename bakery">Marcus's bakery</h1>
        <div class="rename-hint">(click name to rename)</div>
      </header>

      <section class="cookie-stats-display" aria-live="polite">
        <div id="cookie-count" class="main-cookie-counter">0 cookies</div>
        <div id="cookie-cps" class="main-cps-counter">per second: 0</div>
      </section>

      <!-- Central Cookie Stage -->
      <main class="big-cookie-stage">
        <div id="cookie-shine" class="cookie-shine-rays" aria-hidden="true"></div>
        <div id="cursor-orbit-ring" class="cursor-orbit-container" aria-hidden="true"></div>

        <button id="big-cookie" class="big-cookie-btn" aria-label="Bake a cookie">
          <!-- Scalable Vector Graphic Cookie with realistic textured crumbs & chocolate chips -->
          <svg class="big-cookie-svg" viewBox="0 0 200 200" width="100%" height="100%">
            <defs>
              <radialGradient id="cookieGrad" cx="38%" cy="32%" r="65%">
                <stop offset="0%" stop-color="#dfaa66" />
                <stop offset="55%" stop-color="#c1833e" />
                <stop offset="85%" stop-color="#9a5e23" />
                <stop offset="100%" stop-color="#64380e" />
              </radialGradient>
              <radialGradient id="chipGrad" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#55270d" />
                <stop offset="70%" stop-color="#2c1203" />
                <stop offset="100%" stop-color="#140601" />
              </radialGradient>
              <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
              </filter>
            </defs>

            <!-- Base Cookie Dough -->
            <circle cx="100" cy="100" r="92" fill="url(#cookieGrad)" filter="url(#dropGlow)" stroke="#532909" stroke-width="4" />
            
            <!-- Surface Dough Wrinkles / Crumbles -->
            <path d="M45,70 Q60,65 75,72 T110,68" stroke="#874e17" stroke-width="2.5" fill="none" opacity="0.6" />
            <path d="M125,120 Q145,130 160,118" stroke="#874e17" stroke-width="2" fill="none" opacity="0.5" />
            <path d="M60,135 Q80,145 105,138" stroke="#874e17" stroke-width="2" fill="none" opacity="0.5" />

            <!-- Chocolate Chips -->
            <!-- Chip 1 -->
            <ellipse cx="65" cy="60" rx="14" ry="12" fill="url(#chipGrad)" transform="rotate(-15 65 60)" />
            <circle cx="62" cy="57" r="2.5" fill="#7d3e18" opacity="0.7" />
            <!-- Chip 2 -->
            <ellipse cx="125" cy="52" rx="16" ry="14" fill="url(#chipGrad)" transform="rotate(25 125 52)" />
            <circle cx="122" cy="48" r="3" fill="#7d3e18" opacity="0.7" />
            <!-- Chip 3 -->
            <ellipse cx="100" cy="102" rx="17" ry="15" fill="url(#chipGrad)" transform="rotate(8 100 102)" />
            <circle cx="96" cy="98" r="3.5" fill="#7d3e18" opacity="0.7" />
            <!-- Chip 4 -->
            <ellipse cx="145" cy="115" rx="15" ry="12" fill="url(#chipGrad)" transform="rotate(-30 145 115)" />
            <!-- Chip 5 -->
            <ellipse cx="58" cy="115" rx="15" ry="13" fill="url(#chipGrad)" transform="rotate(40 58 115)" />
            <!-- Chip 6 -->
            <ellipse cx="90" cy="155" rx="16" ry="13" fill="url(#chipGrad)" transform="rotate(-10 90 155)" />
            <!-- Chip 7 -->
            <ellipse cx="140" cy="155" rx="13" ry="11" fill="url(#chipGrad)" transform="rotate(15 140 155)" />
            <!-- Chip 8 (small) -->
            <ellipse cx="40" cy="90" rx="9" ry="8" fill="url(#chipGrad)" />
            <!-- Chip 9 (small) -->
            <ellipse cx="160" cy="80" rx="10" ry="8" fill="url(#chipGrad)" />
          </svg>
        </button>
      </main>

      <!-- Milk Wave Base at Column Bottom -->
      <div id="milk-container" class="milk-container" aria-hidden="true">
        <div class="milk-wave wave-back"></div>
        <div class="milk-wave wave-front"></div>
      </div>
    </aside>

    <!-- CENTER COLUMN: News Ticker, Navigation Tabs, Buildings Visualizer, Active Buffs -->
    <section id="section-middle" class="game-column" aria-label="Game Feed & Panels">
      <!-- News Ticker -->
      <div class="news-ticker-container" title="Click to cycle headlines">
        <div class="news-ticker-badge">NEWS</div>
        <div id="news-ticker-text" class="news-ticker-text">Loading latest bakery reports...</div>
      </div>

      <!-- Navigation Tabs -->
      <nav class="game-nav-bar" aria-label="Main Menu">
        <button id="tab-btn-options" class="nav-tab-btn">Options</button>
        <button id="tab-btn-stats" class="nav-tab-btn">Stats</button>
        <button id="tab-btn-info" class="nav-tab-btn">Info</button>
        <button id="tab-btn-legacy" class="nav-tab-btn btn-legacy-tab">Legacy</button>
      </nav>

      <!-- Active Golden Buffs Bar -->
      <div id="active-buffs-bar" class="active-buffs-bar"></div>

      <!-- Buildings Visualizer Area (shows when no menu open) -->
      <div id="buildings-visualizer" class="buildings-visualizer">
        <div class="visualizer-placeholder">Purchase grandmas, farms, and factories to populate your bakery!</div>
      </div>

      <!-- Menu Panels Container (Stats / Options / Info / Legacy) -->
      <div id="menu-panel-container" class="menu-panel-container hidden"></div>
    </section>

    <!-- RIGHT COLUMN: Store (Buy/Sell, Multipliers, Upgrades Shelf, Buildings List) -->
    <aside id="section-right" class="game-column" aria-label="Store & Buildings">
      <div class="store-header">
        <h2 class="store-title">Store</h2>
        <div class="store-controls">
          <!-- Buy / Sell Toggle -->
          <div class="store-mode-toggle">
            <button id="mode-buy" class="store-mode-btn active">Buy</button>
            <button id="mode-sell" class="store-mode-btn">Sell</button>
          </div>
          <!-- Multiplier Selectors -->
          <div class="store-multiplier-group">
            <button id="buy-amt-1" class="store-amt-btn active">1</button>
            <button id="buy-amt-10" class="store-amt-btn">10</button>
            <button id="buy-amt-100" class="store-amt-btn">100</button>
            <button id="buy-amt-max" class="store-amt-btn">Max</button>
          </div>
        </div>
      </div>

      <!-- Upgrades Shelf -->
      <div class="upgrades-shelf-wrapper">
        <div class="upgrades-shelf-label">Upgrades</div>
        <div id="upgrades-shelf" class="upgrades-shelf">
          <!-- Dynamically populated upgrade icons -->
        </div>
      </div>

      <!-- Buildings List -->
      <div id="buildings-list" class="buildings-list">
        <!-- Dynamically populated building rows -->
      </div>
    </aside>
  </div>

  <!-- Dynamic Notifications & Tooltip Layer -->
  <div id="notifications-container" class="notifications-container" aria-live="assertive"></div>
  <div id="game-tooltip" class="game-tooltip hidden" role="tooltip"></div>
  <div id="particle-container" class="particle-container" aria-hidden="true"></div>

  <!-- Game Bootstrap -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
